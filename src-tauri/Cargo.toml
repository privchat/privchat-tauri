[package]
name = "privchat-desktop"
version = "0.1.0"
description = "PrivChat desktop client"
authors = ["junjie722@gmail.com"]
edition = "2021"
default-run = "privchat-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "privchat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["sqlite-store"]
memory-store = []
sqlite-store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.98"
thiserror = "2.0.12"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
tokio = "1.46.1"
base64 = "0.22.1"
uuid = { version = "1.17.0", features = ["v4"] }
reqwest = { version = "0.12.22", default-features = false, features = ["multipart", "json", "rustls-tls"] }
url = "2"
privchat-sdk-ffi = { path = "../../privchat-rust/crates/privchat-sdk-ffi" }
